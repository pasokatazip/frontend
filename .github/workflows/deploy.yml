name: front-ci-cd
# ************************
# 実行するタイミングを指定
# developとmainにpushされたときと、pull requestが作成されたとき
# ************************
on:
  push:
    branches:
      - develop
      - main

  pull_request:


# ************************
# 実行する処理の内容を書いている
# test → コードのチェック
# docker → Docker image作成
# ************************
jobs:
  test:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest  # 実行するOS

    steps: # 実行する手順

      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 24 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm # キャッシュの設定

      # pnpmをインストール
      - name: Install pnpm
        run: npm install -g pnpm@10.16.1

      # pnpm-lock.yaml から依存関係をインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # コードの書き方チェック
      - name: Lint
        run: pnpm run lint

      # TypeScriptの型チェック
      - name: Typecheck
        run: pnpm run typecheck

      # Next.jsのbuildが通るか確認
      - name: Build
        run: pnpm run build

  # ************************
  # Docker imageを作成してGHCRにpushする処理を書いている
  # ************************
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test # testが成功した時だけ

    # push時だけDocker imageを作成
    # pullrequestでimageをpushしない、スキップするための条件
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildxを使えるようにする
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCRにログイン
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker imageをbuildしてGHCRへpush
      # developなら develop と コミットID
      # mainなら main と コミットID
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: prod
          tags: |
            ghcr.io/pasokatazip/frontend:${{ github.ref_name }}
            ghcr.io/pasokatazip/frontend:${{ github.sha }}