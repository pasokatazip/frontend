# mainブランチにpushされたらDocker imageをGHCRへpush
name: front-ci-cd

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.jsを準備
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-lock.yaml、pnpm installする
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlintでLint確認
      - name: Lint
        run: pnpm run lint

      # TypeScript型チェックを実行
      - name: Typecheck
        run: pnpm run typecheck

      # Next.jsの本番buildが通るか確認
      - name: Build
        run: pnpm run build

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    # mainにpushされたときだけimageをpush
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildxを使えるようにする
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registryへログイン
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # prod をbuildしてGHCRへpush
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: prod
          tags: |
            ghcr.io/pasokatazip/frontend:latest
            ghcr.io/pasokatazip/frontend:${{ github.sha }}