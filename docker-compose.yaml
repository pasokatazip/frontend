services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev

    container_name: app-front

    ports:
      - "3000:3000"

    environment:
      PETYOYO_API_URL: ${PETYOYO_API_URL}
      PETYOYO_IMAGE_URL: ${PETYOYO_IMAGE_URL}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}

    volumes:
      # ローカルのコード変更をコンテナに反映
      - .:/app

      # node_modulesはコンテナ側volumeで保持
      - front-node-modules:/app/node_modules

      # Next.jsの生成物はコンテナ側の書き込み可能なvolumeで保持
      - front-next:/app/.next

    command: sh -c "pnpm install --frozen-lockfile && pnpm run dev -H 0.0.0.0"

volumes:
  front-node-modules:
  front-next:
